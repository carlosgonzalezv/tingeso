version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tingeso-postgres
    environment:
      POSTGRES_DB: tingeso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: link5321
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: tingeso-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tingeso
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: link5321
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    networks:
      - backend-network

  backend1: &backend_base
    image: carlosgv5/payroll-backend:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tingeso
      - DB_USER=postgres
      - DB_PASSWORD=link5321
      - KCK_URL=http://keycloak:8080/realms/TravelAgency
      - KCK_JWK_URL=http://keycloak:8080/realms/TravelAgency/protocol/openid-connect/certs
      - KCK_REALM=TravelAgency
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    depends_on:
      - postgres
      - keycloak
    networks:
      - backend-network

  backend2:
    <<: *backend_base
  backend3:
    <<: *backend_base

  nginx-backend:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./frontend/nginx-backend.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      backend-network:
        aliases:
          - backend

  frontend1: &frontend_base
    image: carlosgv5/payroll-frontend:latest
    volumes:
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx-backend
    networks:
      - frontend-network
      - backend-network
  frontend2:
    <<: *frontend_base
  frontend3:
    <<: *frontend_base

  nginx-frontend:
    image: nginx:alpine
    ports:
      - "8070:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx-backend
      - frontend1
      - frontend2
      - frontend3
    networks:
      - frontend-network
      - backend-network

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge

volumes:
  postgres-data: